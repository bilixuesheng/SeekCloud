name: Sandbox image

# 通用镜像（#17）：在测试机上构建，用 Sysbox 建一个沙箱跑镜像自带的自检（apps/host/sandbox/image/check.sh）。
# 和 sandbox.yml 一样只在本仓库分支的推送和手动触发时跑。日志是公开的：自检只打印版本号和通过与否。
on:
  push:
    paths:
      - "apps/host/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'bilixuesheng/SeekCloud'
    runs-on: [self-hosted, sysbox]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 构建通用镜像
        working-directory: apps/host/sandbox
        run: |
          docker build --progress=plain -f image/Dockerfile \
            --build-arg SEEKCLOUD_IMAGE_VERSION="$(cat image/VERSION)-ci" \
            -t seekcloud-sandbox:ci .
          docker image inspect --format '镜像大小：{{.Size}} 字节' seekcloud-sandbox:ci
      - name: 用 Sysbox 建一个沙箱跑自检
        run: |
          name="sandbox-image-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --runtime=sysbox-runc --name "$name" --memory 3g --cpus 2 seekcloud-sandbox:ci
          docker exec "$name" bash /usr/local/lib/seekcloud/check.sh
      - name: 删掉不用的旧镜像
        if: always()
        run: docker image prune --force >/dev/null
