name: Android

# 安卓 App（apps/android，#123）：单元测试、静态检查（Android lint）、构建调试版的安装包。
# App 不进 pnpm 的工作区，根目录的四个检查命令不管它，只在 apps/android 改了时跑这一个工作流。
on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 也核对 gradle-wrapper.jar 是 Gradle 官方发的那一个
      - uses: gradle/actions/setup-gradle@v4

      - name: 装编译用的安卓平台
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: 单元测试、静态检查、构建调试版
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: 上传调试版的安装包
        uses: actions/upload-artifact@v4
        with:
          name: seekcloud-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 失败时上传检查报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
