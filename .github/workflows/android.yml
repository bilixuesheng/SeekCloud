name: Android

# 安卓 App（apps/android，#123）：单元测试、静态检查（Android lint）、构建调试版的安装包；
# 界面测试（ui，#205）在模拟器上跑，连两台主站测试工具起的假主站。
# App 不进 pnpm 的工作区，根目录的四个检查命令不管它，只在 apps/android 改了时跑这一个工作流。
on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/site/src/testing/app-test-server.ts"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/site/src/testing/app-test-server.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 也核对 gradle-wrapper.jar 是 Gradle 官方发的那一个
      - uses: gradle/actions/setup-gradle@v4

      - name: 装编译用的安卓平台
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: 单元测试、静态检查、构建调试版
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: 上传调试版的安装包
        uses: actions/upload-artifact@v4
        with:
          name: seekcloud-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 失败时上传检查报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7

  # 界面测试（app/src/androidTest，#205）：模拟器里的 App 经 10.0.2.2 连这台机器上的两台假主站
  # （apps/site 的 pnpm app-test-server，主站的测试工具起的，要 PostgreSQL），走连接、登录、退出、换服务器、令牌被吊销。
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: 装编译用的安卓平台
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: 构建 App 和界面测试
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: 起两台假主站
        working-directory: apps/site
        run: |
          nohup pnpm app-test-server 2 > "$RUNNER_TEMP/sites.log" 2>&1 &
          for _ in $(seq 90); do grep -q '^ready$' "$RUNNER_TEMP/sites.log" && break; sleep 2; done
          grep -q '^ready$' "$RUNNER_TEMP/sites.log" || { cat "$RUNNER_TEMP/sites.log"; exit 1; }
          ports=$(grep -o '"port":[0-9]*' "$RUNNER_TEMP/sites.log" | cut -d: -f2)
          echo "SITE_A=http://10.0.2.2:$(echo "$ports" | sed -n 1p)" >> "$GITHUB_ENV"
          echo "SITE_B=http://10.0.2.2:$(echo "$ports" | sed -n 2p)" >> "$GITHUB_ENV"
          echo "SITE_PASSWORD=$(grep -o '"password":"[^"]*"' "$RUNNER_TEMP/sites.log" | head -1 | cut -d'"' -f4)" >> "$GITHUB_ENV"

      # 模拟器要 KVM
      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器上跑界面测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # 默认的屏幕只有 320x640，换成常见手机的大小
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/android
          # 跑完把截图（#178 的底栏）从模拟器上拉下来：测试失败也拉，退出码照测试的
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.siteA="$SITE_A"
            -Pandroid.testInstrumentationRunnerArguments.siteB="$SITE_B"
            -Pandroid.testInstrumentationRunnerArguments.password="$SITE_PASSWORD";
            status=$?;
            adb pull /data/local/tmp/seekcloud-screens "$RUNNER_TEMP/screens" || true;
            exit $status

      # 截图缩小一半打进日志（分段，每行一段）：云端会话里没有模拟器，从日志取回来看
      - name: 打印界面截图
        if: always()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/screens/*.png; do
            small="${f%.png}.jpg"
            convert "$f" -resize 50% -quality 82 "$small" 2>/dev/null || small="$f"
            name=$(basename "$small")
            base64 -w 60000 "$small" | awk -v n="$name" '{ print "SCREENSHOT " n " " NR " " $0 }'
          done

      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/screens/
          if-no-files-found: ignore
          retention-days: 14

      # 报告要下载才能看：失败的测试和原因直接打在日志里
      - name: 失败时打印失败的测试
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("apps/android/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"::group::{case.get('classname')}.{case.get('name')}")
                      print((failure.text or failure.get("message") or "")[:30000])
                      print("::endgroup::")
          PY
          tail -n 50 "$RUNNER_TEMP/sites.log" || true

      - name: 失败时上传测试报告和假主站的日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-reports
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/sites.log
          retention-days: 7
