name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # 浏览器测试（*.browser.test.ts）：侧栏的拖动和手势在真的 Chromium 里用触摸和鼠标测（#153）。
  # 要构建好的网页（startPreview 起一个本地主站），浏览器按 playwright-core 的版本装。
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seekcloud/site build
      - name: 装 Chromium
        run: pnpm --filter @seekcloud/site exec playwright-core install --with-deps chromium
      - name: 测试
        env:
          SEEKCLOUD_BROWSER_TESTS: "1"
        run: pnpm --filter @seekcloud/site exec vitest run --reporter=verbose browser.test

  # 用真的 dsh 测基线配置、SeekCloud 的 dsh 插件和 Agent 适配接口的契约测试（apps/host/src/dsh-*.test.ts、src/agent/）：
  # dsh 要 Node 24.9 以上，版本按 apps/host/sandbox/dsh/VERSION 装，模型服务是假的，不需要任何密钥。
  dsh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 装真的 dsh
        run: |
          mkdir -p "$RUNNER_TEMP/dsh"
          cd "$RUNNER_TEMP/dsh"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@deepseek-ai/dsh@$(cat "$GITHUB_WORKSPACE/apps/host/sandbox/dsh/VERSION")"
      - name: 测试
        env:
          SEEKCLOUD_DSH_BIN: ${{ runner.temp }}/dsh/node_modules/.bin/dsh
        # 一个一个写出每个测试的结果：卡住时看得出是哪一个
        run: pnpm --filter @seekcloud/host exec vitest run --reporter=verbose src/dsh- src/agent/
