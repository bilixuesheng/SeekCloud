name: Sandbox

# 要真沙箱（Sysbox）的测试，跑在测试机（#14）上：本仓库的 GitHub 自托管 Runner，标签 sysbox。
# 仓库是公开的，所以只在本仓库分支的推送和手动触发时跑，不用 pull_request 触发：
# 别人 fork 以后提的 PR 不会派到测试机上。
on:
  push:
    paths:
      - "apps/host/**"
      # 端到端测试（apps/host/src/e2e.sysbox.test.ts）用真的主站
      - "apps/site/src/server/**"
      - "apps/site/src/testing/**"
      - "packages/protocol/**"
      - "scripts/test-machine.sh"
      - ".github/workflows/sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

# 测试机只有一台：同一个分支新推送时取消还在跑的那次。
concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sysbox:
    if: github.repository == 'bilixuesheng/SeekCloud'
    runs-on: [self-hosted, sysbox]
    timeout-minutes: 40
    steps:
      - name: Sysbox 在运行
        run: |
          systemctl is-active sysbox
          sysbox-runc --version
      - name: Sysbox 容器里能再跑 Docker，容器里的 root 不是宿主机的 root
        run: |
          name="sandbox-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --runtime=sysbox-runc -d --name "$name" docker:dind
          for _ in $(seq 1 60); do
            if docker exec "$name" sh -c 'DOCKER_HOST=unix:///var/run/docker.sock docker info' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          out=$(docker exec "$name" sh -c 'DOCKER_HOST=unix:///var/run/docker.sock docker run --rm hello-world')
          echo "$out" | head -n 3
          [[ "$out" == *"Hello from Docker"* ]]
          read -r inside outside _ < <(docker exec "$name" head -n1 /proc/self/uid_map)
          echo "用户映射：容器里的 $inside → 宿主机的 $outside"
          [[ "$inside" == 0 && "$outside" != 0 ]]
      # 下面是宿主机守护进程的沙箱测试（#18）。日志是公开的：测试里不打印测试机的地址。
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # 端到端测试里主站要一个 PostgreSQL：起一个只监听本机的容器，跑完删掉
      - name: 端到端测试用的 PostgreSQL
        run: |
          docker rm -f seekcloud-test-pg >/dev/null 2>&1 || true
          docker run -d --name seekcloud-test-pg -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:55432:5432 postgres:17-alpine >/dev/null
          for _ in $(seq 1 60); do
            docker exec seekcloud-test-pg pg_isready -U postgres -q && exit 0
            sleep 1
          done
          echo "PostgreSQL 没有起来"; docker logs --tail 20 seekcloud-test-pg; exit 1
      - name: 真沙箱的测试
        env:
          SEEKCLOUD_DOCKER_TESTS: "1"
          SEEKCLOUD_SYSBOX_TESTS: "1"
          SEEKCLOUD_SANDBOX_RUNTIME: sysbox-runc
          # Runner 不是 root：防火墙规则借特权容器加（docker 组本来就等于 root）
          SEEKCLOUD_TEST_ROOT: docker
          SEEKCLOUD_TEST_INTERNET: "1"
          # sandbox-image.yml 在测试机上构建的通用镜像：在真的沙箱里跑一个回合（turn.sysbox.test.ts）
          SEEKCLOUD_SANDBOX_TEST_IMAGE: seekcloud-sandbox:ci
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
        run: pnpm --filter @seekcloud/host exec vitest run src/sandbox src/e2e.sysbox.test.ts
      - name: 删掉测试用的 PostgreSQL
        if: always()
        run: docker rm -f seekcloud-test-pg >/dev/null 2>&1 || true
