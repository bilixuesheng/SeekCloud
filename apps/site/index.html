<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfcff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SeekCloud：云端编程智能体。代码无界，智能随行。" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SeekCloud</title>
    <script>
      // 设置里选的外观（跟随系统 / 浅色 / 深色）。在页面画出来之前设好，免得先闪一下另一种颜色。
      try {
        const theme = localStorage.getItem("seekcloud:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          // 地址栏、状态栏的颜色也跟着选的外观，不跟系统（颜色和 theme.ts 的 PAGE_COLOR 一致）
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.content = theme === "dark" ? "#15171c" : "#fbfcff";
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
